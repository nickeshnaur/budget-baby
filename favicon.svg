<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Main coin face -->
  <circle cx="45" cy="50" r="40" fill="white" stroke="black" stroke-width="4"/>

  <!-- Green crescent shading on left -->
  <path d="M20 25
    C10 40, 10 65, 25 80
    C15 65, 15 40, 25 25
    C22 25, 20 25, 20 25Z"
    fill="#22c55e"/>

  <!-- Inner ring -->
  <circle cx="45" cy="50" r="30" fill="none" stroke="black" stroke-width="3"/>

  <!-- Dollar sign -->
  <path d="M45 30 L45 70" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <path d="M55 38
    C55 33, 48 30, 42 32
    C36 34, 35 40, 40 44
    C45 48, 55 52, 55 58
    C55 65, 48 68, 42 66
    C36 64, 35 60, 35 60"
    fill="none"
    stroke="black"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Coin edge (3D effect) -->
  <path d="M85 30
    C92 40, 92 60, 85 70"
    fill="none"
    stroke="black"
    stroke-width="4"/>
  <line x1="86" y1="38" x2="92" y2="38" stroke="black" stroke-width="2"/>
  <line x1="87" y1="45" x2="93" y2="45" stroke="black" stroke-width="2"/>
  <line x1="87" y1="52" x2="93" y2="52" stroke="black" stroke-width="2"/>
  <line x1="87" y1="59" x2="93" y2="59" stroke="black" stroke-width="2"/>
  <line x1="86" y1="66" x2="92" y2="66" stroke="black" stroke-width="2"/>

  <!-- Sparkle -->
  <path d="M78 12 L80 8 L82 12 L86 14 L82 16 L80 20 L78 16 L74 14 Z" fill="black"/>
</svg>
